<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Génesis Nails</title>

    <style>
        * {
            box-sizing: border-box;
        }

        html {
            scroll-behavior: smooth;
        }

        body {
            margin: 0;
            background: #fff1f6;
            color: #71394e;
            font-family: Georgia, serif;
        }

        header {
            min-height: 100vh;
            padding: 50px 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            background: linear-gradient(135deg, #fffafd, #f4cfdd);
        }

        .logo {
            width: 200px;
            height: 200px;
            object-fit: contain;
            margin-bottom: 20px;
        }

        h1 {
            margin: 10px 0;
            font-family: cursive;
            font-size: 70px;
            font-weight: normal;
            color: #7b4058;
        }

        .subtitulo {
            font-size: 17px;
            letter-spacing: 4px;
            color: #986078;
        }

        .descripcion {
            max-width: 500px;
            font-size: 18px;
            line-height: 1.6;
            margin-top: 25px;
        }

        .botones {
            margin-top: 30px;
            display: flex;
            justify-content: center;
            gap: 10px;
            flex-wrap: wrap;
        }

        .boton {
            display: inline-block;
            padding: 14px 24px;
            background: #82465f;
            color: white;
            text-decoration: none;
            border-radius: 30px;
            font-family: Arial, sans-serif;
            font-size: 14px;
        }

        section {
            padding: 70px 20px;
        }

        .titulo {
            text-align: center;
            margin-bottom: 40px;
        }

        .titulo h2 {
            font-family: cursive;
            font-size: 55px;
            font-weight: normal;
            color: #7b4058;
        }

        .titulo p {
            font-family: Arial, sans-serif;
        }
