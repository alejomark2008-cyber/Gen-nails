<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Génesis Nails</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600;700&family=Great+Vibes&display=swap"
          rel="stylesheet">

    <style>

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html {
            scroll-behavior: smooth;
        }

        body {
            background: #fff6f9;
            color: #5b3545;
            font-family: "Cormorant Garamond", serif;
        }

        /* =========================
           PORTADA
        ========================= */

        .portada {
            min-height: 100vh;
            padding: 40px 20px;

            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;

            text-align: center;

            background:
                radial-gradient(
                    circle at 15% 20%,
                    #ffffff,
                    transparent 30%
                ),
                radial-gradient(
                    circle at 85% 80%,
                    #f5cad9,
                    transparent 35%
                ),
                linear-gradient(
                    135deg,
                    #fff8fa,
                    #f7d8e4
                );

            position: relative;
            overflow: hidden;
        }

        .portada::before {
            content: "♡     ✦     ♡";

            position: absolute;
            top: 30px;

            color: #b77b91;

            font-size: 22px;
            letter-spacing: 10px;

            opacity: .6;
        }

        .portada::after {
            content: "✦";

            position: absolute;
            bottom: 35px;

            color: #b77b91;

            font-size: 25px;
        }

        /* =========================
           LOGO
        ========================= */

        .logo-container {
            width: 210px;
            height: 210px;

            display: flex;
            align-items: center;
            justify-content: center;

            margin-bottom: 20px;

            border-radius: 50%;

            background: rgba(255,255,255,.55);

            box-shadow:
                0 15px 40px rgba(100,40,60,.12),
                inset 0 0 20px rgba(255,255,255,.8);
        }

        .logo {
            width: 185px;
            height: 185px;

            object-fit: contain;
        }

        /* =========================
           TITULO
        ========================= */

        h1 {
            font-family: "Great Vibes", cursive;

            font-size: clamp(60px, 12vw, 105px);

            font-weight: 400;

            color: #7b4058;

            line-height: 1;
        }

        .frase {
            margin-top: 12px;

            font-family: "Cormorant Garamond", serif;

            font-size: 22px;

            letter-spacing: 4px;

            text-transform: uppercase;

            color: #956075;
        }

        .ornamento {
            margin: 22px 0;

            color: #b36d86;

            font-size: 25px;
        }

        .descripcion {
            max-width: 520px;

            font-size: 19px;

            line-height: 1.7;

            color: #70495a;
        }

        /* =========================
           BOTONES
        ========================= */

        .botones {
            margin-top: 30px;

            display: flex;

            justify-content: center;

            gap: 15px;

            flex-wrap: wrap;
        }

        .boton {
            display: inline-block;

            padding: 14px 30px;

            border-radius: 40px;

            background: #874a63;

            color: white;

            text-decoration: none;

            font-family: "Cormorant Garamond", serif;

            font-size: 18px;

            transition: .3s;
        }

        .boton:hover {
            background: #683447;

            transform: translateY(-3px);
        }

        .boton-secundario {
            background: transparent;

            color: #874a63;

            border: 1px solid #874a63;
        }

        .boton-secundario:hover {
            color: white;
        }

        /* =========================
           SECCIONES
        ========================= */

        .catalogo {
            padding: 90px 6%;

            background: #fffafb;
        }

        .titulo-seccion {
            text-align: center;

            margin-bottom: 50px;
        }

        .titulo-seccion span {
            color: #b36d86;

            letter-spacing: 4px;

            font-size: 13px;
        }

        .titulo-seccion h2 {
            margin-top: 10px;

            font-family: "Great Vibes", cursive;

            font-size: 60px;

            font-weight: 400;

            color: #7b4058;
        }

        .titulo-seccion p {
            margin-top: 8px;

            font-size: 19px;

            color: #765362;
        }

        /* =========================
           GALERÍA
        ========================= */

        .galeria {
            max-width: 1200px;

            margin: auto;

            display: grid;

            grid-template-columns: repeat(2, 1fr);

            gap: 28px;
        }

        .tarjeta {
            background: white;

            border-radius: 20px;

            overflow: hidden;

            box-shadow:
                0 10px 30px rgba(80,30,50,.12);

            transition: .35s;
        }

        .tarjeta:hover {
            transform: translateY(-7px);

            box-shadow:
                0 18px 40px rgba(80,30,50,.18);
        }

        .tarjeta img {
            width: 100%;

            height: 500px;

            display: block;

            object-fit: cover;

            transition: .4s;
        }

        .tarjeta:hover img {
            transform: scale(1.03);
        }

        /* =========================
           INSPIRACIÓN
        ========================= */

        .inspiracion {
            padding: 100px 20px;

            text-align: center;

            background:
                linear-gradient(
                    135deg,
                    #f8dce7,
                    #fff4f7
                );
        }

        .inspiracion h2 {
            font-family: "Great Vibes", cursive;

            font-size: 60px;

            font-weight: 400;

            color: #7b4058;

            margin-bottom: 15px;
        }

        .inspiracion p {
            max-width: 600px;

            margin: auto;

            font-size: 19px;

            line-height: 1.7;
        }

        /* =========================
           CONTACTO
        ========================= */

        .contacto {
            padding: 100px 20px;

            text-align: center;

            background: #fffafb;
        }

        .contacto h2 {
            font-family: "Great Vibes", cursive;

            font-size: 60px;

            font-weight: 400;

            color: #7b4058;

            margin: 10px 0 15px;
        }

        .contacto p {
            font-size: 19px;

            margin-bottom: 25px;
        }

        /* =========================
           FOOTER
        ========================= */

        footer {
            padding: 45px 20px;

            text-align: center;

            background: #71394e;

            color: white;
        }

        footer h3 {
            font-family: "Great Vibes", cursive;

            font-size: 45px;

            font-weight: 400;
        }

        footer p {
            margin-top: 8px;

            font-size: 17px;
        }

        /* =========================
           CELULAR
        ========================= */

        @media (max-width: 700px) {

            .logo-container {
                width: 170px;
                height: 170px;
            }

            .logo {
                width: 150px;
                height: 150px;
            }

            h1 {
                font-size: 65px;
            }

            .frase {
                font-size: 17px;

                letter-spacing: 2px;
            }

            .descripcion {
                font-size: 17px;
            }

            .galeria {
                grid-template-columns: 1fr;
            }

            .tarjeta img {
                height: auto;

                aspect-ratio: 1 / 1;

                object-fit: cover;
            }

            .in
