        * {
            box-sizing: border-box;

            padding: 0;

        html {
            scroll-behavior: smooth;

        body {
            background: #fff8fb;
            color: #633f4e;
            font-family: "Cormorant Garamond", serif;

        /* =========================
           PORTADA
        ========================= */

        header {
            min-height: 100vh;

            padding: 50px 20px;

            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;

            text-align: center;

            position: relative;
            overflow: hidden;

            background:
                radial-gradient(
                    circle at 15% 15%,
                    #ffffff 0%,
                    transparent 30%
                ),

                radial-gradient(
                    circle at 85% 85%,
                    #edbfd1 0%,
                    transparent 35%
                ),

                linear-gradient(
                    135deg,
                    #fffafd,
                    #f7d6e2
                );
        }


        header::before {

            content: "✦     ♡     ✦";

            position: absolute;

            top: 30px;

            color: #b77c91;

            font-size: 20px;

            letter-spacing: 8px;

            opacity: .7;
        }


        header::after {

            content: "♡";

            position: absolute;

            bottom: 30px;

            color: #b77c91;

            font-size: 24px;
        }

           LOGO
        ========================= */

            height: 210px;

            border-radius: 50%;

            padding: 8px;

            box-shadow:
                0 15px 40px rgba(90,40,60,.12);
        }
