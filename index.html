<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Génesis Nails</title>

    <!-- Tipografías elegantes -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link href="https://fonts.googleapis.com/css2?family=Allura&family=Montserrat:wght@300;400;500;600&display=swap" rel="stylesheet">

    <style>

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        html {
            scroll-behavior: smooth;
        }

        body {
            background: #fff3f7;
            color: #633c4d;
            font-family: "Montserrat", sans-serif;
        }

        /* =========================
           PORTADA
        ========================= */

        header {
            min-height: 100vh;

            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;

            text-align: center;

            padding: 50px 20px;

            background:
                radial-gradient(
                    circle at 10% 20%,
                    #ffffff 0%,
                    transparent 30%
                ),
                radial-gradient(
                    circle at 90% 80%,
                    #f3c5d6 0%,
                    transparent 35%
                ),
                linear-gradient(
                    135deg,
                    #fffafd,
                    #f6d5e2
                );

            position: relative;
            overflow: hidden;
        }

        header::before {
            content: "♡   ✦   ♡";

            position: absolute;
            top: 30px;

            font-size: 22px;

            color: #b4778e;

            letter-spacing: 8px;
        }

        /* LOGO */

        .logo {
            width: 210px;
            height: 210px;

            object-fit: contain;

            margin-bottom: 25px;

            border-radius: 50%;

            background: rgba(255,255,255,.6);

            padding: 8px;

            box-shadow:
                0 15px 40px rgba(100,40,60,.13);
        }

        /* NOMBRE */

        h1 {
            font-family: "Allura", cursive;

            font-size: clamp(75px, 14vw, 125px);

            font-weight: 400;

            line-height: 1;

            color: #793f57;
        }

        .subtitulo {
            margin-top: 18px;

            font-size: 14px;

            letter-spacing: 5px;

            text-transform: uppercase;

            color: #986178;
        }

        .frase {
            max-width: 550px;

            margin-top: 25px;

            font-size: 18px;

            line-height: 1.7;

            color: #704658;
        }

        .decoracion {
            margin: 25px 0;

            font-size: 25px;

            color: #b56f88;
        }

        /* =========================
           BOTONES
        ========================= */

        .botones {
            margin-top: 30px;

            display: flex;

            justify-content: center;

            gap: 12px;

            flex-wrap: wrap;
        }

        .boton {
            display: inline-block;

            padding: 14px 25px;

            border-radius: 40px;

            background: #82465f;

            color: white;

            text-decoration: none;

            font-size: 15px;

            transition: .3s;

            box-shadow:
                0 8px 20px rgba(100,40,60,.12);
        }

        .boton:hover {
            background: #693449;

            transform: translateY(-3px);
        }
