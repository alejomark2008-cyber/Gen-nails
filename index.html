<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Génesis Nails</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600;700&family=Great+Vibes&display=swap" rel="stylesheet">

    <style>

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        html {
            scroll-behavior: smooth;
        }

        body {
            font-family: "Cormorant Garamond", serif;
            color: #623c4d;
            background: #fff4f8;
        }

        /* PORTADA */

        .portada {
            min-height: 100vh;
            padding: 40px 20px;

            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;

            text-align: center;

            background:
                radial-gradient(
                    circle at 15% 20%,
                    rgba(255,255,255,.95),
                    transparent 30%
                ),
                radial-gradient(
                    circle at 85% 80%,
                    rgba(246,200,216,.8),
                    transparent 35%
                ),
                linear-gradient(
                    135deg,
                    #fff9fb,
                    #f6d7e3
                );
        }

        /* LOGO */

        .logo {
            width: 190px;
            height: 190px;
            object-fit: contain;
            margin-bottom: 20px;

            border-radius: 50%;

            background: rgba(255,255,255,.55);

            padding: 8px;

            box-shadow:
                0 15px 35px rgba(100,50,70,.15);
        }

        /* TITULO */

        h1 {
            font-family: "Great Vibes", cursive;
            font-size: clamp(60px, 12vw, 105px);
            font-weight: 400;
            color: #7b4058;
            line-height: 1;
        }

        .frase {
            margin-top: 15px;
            font-size: 21px;
            letter-spacing: 4px;
            text-transform: uppercase;
            color: #986078;
        }

        .ornamento {
            margin: 25px 0;
            color: #b66d88;
            font-size: 25px;
        }

        .descripcion {
            max-width: 520px;
            font-size: 20px;
            line-height: 1.6;
        }
