<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Génesis Nails</title>

    <link rel="stylesheet" href="estilo.css">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600;700&family=Great+Vibes&display=swap" rel="stylesheet">
</head>

<body>

    <!-- PORTADA -->
    <header class="portada">

        <div class="brillo brillo-1"></div>
        <div class="brillo brillo-2"></div>

        <!-- LOGO -->
        <div class="logo-container">
            <img
                src="imagen/logo.png_20260816_161851_0000.png"
                alt="Logo Génesis Nails"
                class="logo"
            >
        </div>

        <!-- NOMBRE -->
        <h1>Génesis Nails</h1>

        <p class="frase">
            Belleza en cada detalle
        </p>

        <div class="ornamento">✦</div>

        <p class="descripcion">
            Diseños de uñas elegantes, delicados y únicos.
            Encuentra el estilo perfecto para ti.
        </p>

        <!-- BOTONES -->
        <div class="botones">

            <a href="#catalogo" class="boton">
                Ver diseños
            </a>

            <a href="#contacto" class="boton boton-secundario">
                Contactar
            </a>

        </div>

    </header>


    <!-- CATÁLOGO -->
    <section id="catalogo" class="catalogo">

        <div class="titulo-seccion">

            <span>✦</span>

            <h2>Nuestros diseños</h2>

            <p>
                Descubre nuestra colección
            </p>

        </div>


        <!-- GALERÍA -->
        <div class="galeria">

            <div class="tarjeta">
                <img
                    src="imagen/coleccion-01.jpg"
                    alt="Diseño de uñas 1"
                >
            </div>
