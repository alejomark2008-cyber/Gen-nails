<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Génesis Nails</title>

    <style>
        body {
            margin: 0;
            background: #fff1f6;
            color: #71394e;
            font-family: Arial, sans-serif;
            text-align: center;
        }

        header {
            padding: 50px 20px;
        }

        header img {
            width: 200px;
            max-width: 80%;
        }

        h1 {
            font-family: Georgia, serif;
            font-size: 55px;
            margin: 20px 0 10px;
        }

        p {
            font-size: 18px;
        }

        .botones {
            margin: 30px 0;
        }

        .boton {
            display: inline-block;
            padding: 14px 25px;
            margin: 5px;
            background: #8b4b65;
            color: white;
            text-decoration: none;
            border-radius: 30px;
        }

        section {
            padding: 60px 20px;
        }

        .galeria {
            max-width: 1000px;
            margin: auto;
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 25px;
        }

        .galeria img {
            width: 100%;
            height: 450px;
            object-fit: cover;
            border-radius: 20px;
            display: block;
        }

        @media (max-width: 700px) {
            .galeria {
                grid-template-columns: 1fr;
            }

            .galeria img {
                height: auto;
            }

            h1 {
                font-size: 45px;
            }
        }
    </style>
</head>

<body>

    <header>

        <img
            src="./img/logo.png_20260816_161851_0000.png"
            alt="Génesis Nails"
        >

        <h1>Génesis Nails</h1>

        <p>
            Belleza en cada detalle
        </p>

        <div class="botones">

            <a href="#disenos" class="boton">
                Ver diseños
            </a>

            <a href="#manos" class="boton">
                Diseños en manos
            </a>

            <a href="#contacto" class="boton">
                Contactar
            </a>

        </div>

    </header>


    <section id="disenos">

        <h2>✨ Nuestros diseños ✨</h2>

        <p>Descubre nuestra colección</p>

        <div class="galeria">

            <img src="./img/coleccion-01.jpg" alt="Diseño 1">

            <img src="./img/coleccion-02.jpg" alt="Diseño 2">

            <img src="./img/coleccion-03.jpg" alt="Diseño 3">

            <img src="./img/coleccion-04.jpg" alt="Diseño 4">

            <img src="./img/coleccion-05.jpg" alt="Diseño 5">

            <img src="./img/coleccion-06.jpg" alt="Diseño 6">

            <img src="./img/coleccion-07.jpg" alt="Diseño 7">

            <img src="./img/coleccion-08.jpg" alt="Diseño 8">

        </div>

    </section>


    <section id="manos">

        <h2>Diseños en manos</h2>

        <p>
            Aquí podremos colocar las fotografías
            de los diseños aplicados en manos.
        </p>

    </section>


    <section id="contacto">

        <h2>Contacto</h2>

        <p>
            323 424 5644
        </p>

    </section>


</body>
</html>
